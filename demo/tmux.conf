# The frame codi is recorded in: one pane, and above it a caption saying what
# is happening, set from demo.tape with: set -g @caption "..."
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
# esc reaches codi at once, rather than waiting to be part of a sequence
set -g escape-time 0
set -g mouse off

set -g status on
set -g status-position top
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g status-format[0] "#[align=centre]#{E:@caption}"
set -g @caption ""

